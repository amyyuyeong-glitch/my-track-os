<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>내 트랙 OS</title>
  <style>
    :root {
      --bg: #f4f4ef;
      --white: #fff;
      --black: #1a1a1a;
      --g1: #555;
      --g2: #888;
      --g3: #bbb;
      --g4: #e4e4e0;
      --g5: #f0f0eb;
      --green: #1a9e5c;
      --green-bg: #e6f9f0;
      --red: #cc3333;
      --red-bg: #fff0f0;
      --tab-h: 60px;
      --safe: env(safe-area-inset-bottom, 0px);
      --r: 16px; --rs: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--black); min-height: 100vh; padding-bottom: calc(var(--tab-h) + var(--safe) + 16px); }

    /* ── 헤더 ── */
    .top-bar { max-width: 640px; margin: 0 auto; padding: 20px 20px 0; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 17px; font-weight: 800; letter-spacing: -0.5px; }
    .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--white); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

    /* ── 패널 ── */
    .panel { display: none; max-width: 640px; margin: 0 auto; padding: 16px 20px; }
    .panel.active { display: block; }

    /* ── 탭바 ── */
    .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--tab-h) + var(--safe)); background: rgba(255,255,255,0.96); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid rgba(0,0,0,0.07); display: flex; align-items: flex-start; padding-top: 6px; z-index: 80; }
    .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; border: none; background: none; font-family: inherit; cursor: pointer; color: var(--g3); transition: color 0.15s; position: relative; }
    .tab-btn.active { color: var(--black); }
    .tab-icon { font-size: 22px; line-height: 1; }
    .tab-label { font-size: 10px; font-weight: 700; }
    .tab-badge { position: absolute; top: 4px; right: calc(50% - 20px); background: var(--red); color: #fff; font-size: 10px; font-weight: 800; border-radius: 100px; padding: 1px 5px; min-width: 16px; text-align: center; display: none; }
    .tab-badge.show { display: block; }

    /* ── 공통 ── */
    .card { background: var(--white); border-radius: var(--r); padding: 18px; margin-bottom: 14px; }
    .section-title { font-size: 13px; font-weight: 800; color: var(--g2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
    .btn-row { display: flex; gap: 8px; }
    .btn-primary { flex: 1; padding: 14px; background: var(--black); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; min-height: 52px; transition: opacity 0.15s; }
    .btn-primary:active { opacity: 0.7; }
    .btn-secondary { padding: 14px 18px; background: var(--g5); color: var(--g1); border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .btn-ghost { padding: 10px 16px; background: none; border: 1.5px solid var(--g4); border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; color: var(--g1); }
    .btn-ghost:hover { border-color: var(--black); color: var(--black); }
    .text-btn { background: none; border: none; font-size: 12px; color: var(--g3); cursor: pointer; font-family: inherit; }
    .text-btn:hover { color: var(--red); }
    .divider { height: 1px; background: var(--g5); margin: 14px 0; }

    /* ── 오늘 대시보드 ── */
    .dash-summary { background: var(--black); border-radius: var(--r); padding: 20px 20px 18px; margin-bottom: 14px; color: #fff; }
    .dash-date { font-size: 12px; opacity: 0.5; margin-bottom: 8px; }
    .dash-numbers { display: flex; align-items: flex-end; gap: 6px; margin-bottom: 14px; }
    .dash-done { font-size: 48px; font-weight: 800; line-height: 1; }
    .dash-sep { font-size: 24px; opacity: 0.3; margin-bottom: 4px; }
    .dash-total { font-size: 24px; opacity: 0.5; margin-bottom: 4px; }
    .dash-label { font-size: 13px; opacity: 0.6; margin-left: 4px; margin-bottom: 6px; }
    .dash-bar-bg { height: 6px; background: rgba(255,255,255,0.2); border-radius: 100px; overflow: hidden; margin-bottom: 14px; }
    .dash-bar-fill { height: 100%; background: #fff; border-radius: 100px; transition: width 0.6s cubic-bezier(0.34,1.2,0.64,1); }
    .dash-stats { display: flex; gap: 16px; }
    .dash-stat { display: flex; align-items: center; gap: 5px; font-size: 12px; opacity: 0.7; }
    .dash-stat-dot { width: 8px; height: 8px; border-radius: 50%; }

    .today-msg { text-align: center; padding: 12px; font-size: 13px; color: var(--g2); font-weight: 600; }

    /* 오늘 실행 리스트 */
    .exec-card { background: var(--white); border-radius: var(--r); overflow: hidden; margin-bottom: 14px; }
    .exec-item { padding: 14px 16px; border-bottom: 1px solid var(--g5); display: flex; align-items: flex-start; gap: 12px; }
    .exec-item:last-child { border-bottom: none; }
    .exec-item.done { opacity: 0.5; }
    .exec-item.failed { opacity: 0.4; }
    .exec-meta { flex: 1; min-width: 0; }
    .exec-track { font-size: 10px; font-weight: 800; color: var(--g3); margin-bottom: 2px; }
    .exec-goal { font-size: 12px; font-weight: 700; color: var(--g2); margin-bottom: 4px; }
    .exec-action { font-size: 14px; font-weight: 700; color: var(--black); line-height: 1.4; }
    .exec-action.done { text-decoration: line-through; color: var(--g2); }
    .exec-action.failed { text-decoration: line-through; color: var(--g3); }
    .exec-original { font-size: 11px; color: var(--g3); margin-top: 3px; }
    .exec-btns { display: flex; gap: 6px; flex-shrink: 0; }
    .exec-btn { width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .exec-btn-done { background: var(--green-bg); color: var(--green); }
    .exec-btn-done.active { background: var(--green); color: #fff; }
    .exec-btn-fail { background: var(--red-bg); color: var(--red); }
    .exec-btn-fail.active { background: var(--red); color: #fff; }

    .finish-btn { width: 100%; padding: 16px; background: var(--g5); color: var(--g1); border: none; border-radius: var(--r); font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; margin-bottom: 14px; transition: all 0.15s; }
    .finish-btn:hover { background: var(--black); color: #fff; }
    .today-empty { background: var(--white); border-radius: var(--r); padding: 48px 24px; text-align: center; }
    .today-empty-icon { font-size: 40px; margin-bottom: 14px; }
    .today-empty-text { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .today-empty-sub { font-size: 13px; color: var(--g2); line-height: 1.7; }
    .go-inbox-btn { margin-top: 16px; padding: 12px 24px; background: var(--black); color: #fff; border: none; border-radius: 100px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }

    /* ── 준비 (인박스) 탭 ── */
    /* Step 1: 입력 */
    .step-indicator { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .step-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--g4); }
    .step-dot.active { background: var(--black); }
    .step-dot.done { background: var(--g2); }
    .step-label { font-size: 12px; font-weight: 700; color: var(--g2); }

    .capture-header { margin-bottom: 14px; }
    .capture-title { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .capture-sub { font-size: 13px; color: var(--g2); line-height: 1.6; }

    .capture-textarea { width: 100%; border: 1.5px solid var(--g4); border-radius: var(--rs); padding: 14px 16px; font-size: 15px; font-family: inherit; outline: none; color: var(--black); resize: none; background: var(--g5); line-height: 1.7; min-height: 160px; transition: border-color 0.15s; }
    .capture-textarea:focus { border-color: var(--black); background: var(--white); }
    .capture-hint { font-size: 12px; color: var(--g3); margin-top: 8px; line-height: 1.6; }

    /* Step 2: 분류 결과 */
    .classify-item { background: var(--white); border-radius: var(--r); padding: 20px; margin-bottom: 12px; }
    .classify-item-text { font-size: 17px; font-weight: 800; color: var(--black); margin-bottom: 16px; line-height: 1.4; }

    /* 연결 목표 카드 */
    .goal-connect-box { border-radius: var(--rs); margin-bottom: 16px; overflow: hidden; }
    .goal-connect-label { font-size: 10px; font-weight: 800; color: var(--g3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .goal-connect-card { background: var(--g5); border-radius: var(--rs); padding: 12px 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: background 0.15s; border: 2px solid transparent; }
    .goal-connect-card:hover { background: var(--g4); }
    .goal-connect-card.selected { background: #f0e8ff; border-color: #c4b5fd; }
    .goal-connect-card.none-selected { background: var(--red-bg); border-color: #fca5a5; }
    .goal-connect-icon { width: 36px; height: 36px; border-radius: 50%; background: var(--white); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .goal-connect-info { flex: 1; min-width: 0; }
    .goal-connect-track { font-size: 10px; font-weight: 800; color: var(--g2); margin-bottom: 2px; }
    .goal-connect-name { font-size: 14px; font-weight: 700; color: var(--black); }
    .goal-connect-change { font-size: 11px; color: var(--g2); flex-shrink: 0; }
    .goal-connect-select { display: none; width: 100%; border: 1.5px solid #c4b5fd; border-radius: var(--rs); padding: 10px 14px; font-size: 14px; font-family: inherit; outline: none; background: var(--white); color: var(--black); cursor: pointer; margin-top: 8px; }
    .goal-connect-select.show { display: block; }

    /* 실행 계획 */
    .steps-label { font-size: 10px; font-weight: 800; color: var(--g3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
    .ai-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 800; background: #f0e8ff; color: #7c3aed; padding: 4px 10px; border-radius: 100px; cursor: pointer; border: none; font-family: inherit; transition: background 0.15s; }
    .ai-badge:hover { background: #e0d0ff; }
    .steps-list-edit { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .step-edit-row { display: flex; align-items: center; gap: 8px; }
    .step-edit-num { font-size: 11px; font-weight: 800; color: var(--g3); min-width: 18px; }
    .step-edit-input { flex: 1; border: 1.5px solid var(--g4); border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none; color: var(--black); background: var(--white); transition: border-color 0.15s; }
    .step-edit-input:focus { border-color: var(--black); }
    .step-del-btn { width: 30px; height: 30px; border: none; background: none; color: var(--g3); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; border-radius: 50%; flex-shrink: 0; }
    .step-del-btn:hover { background: var(--red-bg); color: var(--red); }
    .add-step-btn { width: 100%; padding: 10px; border: 1.5px dashed var(--g3); border-radius: 10px; background: none; font-size: 13px; font-weight: 700; color: var(--g2); cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .add-step-btn:hover { border-color: var(--black); color: var(--black); }

    .classify-skip { font-size: 12px; color: var(--g3); cursor: pointer; text-align: center; padding: 6px; }
    .classify-skip:hover { color: var(--red); }

    /* 처리됨 목록 */
    .processed-item { background: var(--white); border-radius: var(--rs); padding: 12px 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
    .processed-text { flex: 1; font-size: 13px; color: var(--black); }
    .processed-goal { font-size: 11px; color: var(--g2); margin-top: 2px; }
    .processed-tag { font-size: 10px; padding: 2px 8px; border-radius: 100px; font-weight: 700; flex-shrink: 0; }
    .tag-linked { background: var(--green-bg); color: var(--green); }
    .tag-out { background: var(--red-bg); color: var(--red); }
    .tag-later { background: var(--g5); color: var(--g2); }

    /* ── 트랙 탭 ── */
    .track-section { margin-bottom: 18px; }
    .track-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .track-head-name { font-size: 16px; font-weight: 800; flex: 1; }
    .track-icon-btn { background: none; border: none; font-size: 18px; color: var(--g3); cursor: pointer; padding: 4px; min-width: 32px; min-height: 32px; display: flex; align-items: center; justify-content: center; }
    .goal-row { background: var(--white); border-radius: var(--rs); padding: 14px 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background 0.1s; }
    .goal-row:hover { background: var(--g5); }
    .goal-row-info { flex: 1; min-width: 0; }
    .goal-row-name { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
    .goal-row-pump { font-size: 12px; color: var(--g2); }
    .goal-badge { font-size: 10px; padding: 3px 8px; border-radius: 100px; font-weight: 700; flex-shrink: 0; }
    .goal-del-btn { background: none; border: none; font-size: 18px; color: var(--g3); cursor: pointer; padding: 2px 6px; flex-shrink: 0; line-height: 1; border-radius: 6px; }
    .goal-del-btn:hover { background: #ffe5e5; color: var(--danger); }
    .badge-green { background: var(--green-bg); color: var(--green); }
    .badge-yellow { background: #fff8e1; color: #b07c00; }
    .badge-red { background: var(--red-bg); color: var(--red); }
    .add-goal-btn { width: 100%; padding: 12px; border: 1.5px dashed var(--g3); border-radius: var(--rs); background: none; font-size: 13px; font-weight: 700; color: var(--g2); cursor: pointer; font-family: inherit; transition: all 0.15s; margin-bottom: 8px; }
    .add-goal-btn:hover { border-color: var(--black); color: var(--black); }
    .add-track-btn { width: 100%; padding: 14px; border: 2px dashed var(--g3); border-radius: var(--r); background: none; font-size: 14px; font-weight: 700; color: var(--g2); cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .add-track-btn:hover { border-color: var(--black); color: var(--black); }

    /* ── 데일리 탭 ── */
    .daily-field { margin-bottom: 18px; }
    .daily-label { font-size: 10px; font-weight: 800; color: var(--g3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .chip-wrap { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip { padding: 7px 14px; border-radius: 100px; border: 1.5px solid var(--g4); background: var(--white); font-size: 12px; font-weight: 700; cursor: pointer; color: var(--g1); font-family: inherit; min-height: 38px; transition: all 0.15s; }
    .chip.on { border-color: transparent; color: #fff; }
    .chip-add { padding: 7px 12px; border-radius: 100px; border: 1.5px dashed var(--g3); background: none; font-size: 12px; font-weight: 700; color: var(--g2); cursor: pointer; font-family: inherit; min-height: 38px; }
    .daily-input { width: 100%; border: 1.5px solid var(--g4); border-radius: 10px; padding: 12px 14px; font-size: 14px; font-family: inherit; outline: none; color: var(--black); background: var(--g5); min-height: 48px; }
    .daily-input:focus { border-color: var(--black); background: var(--white); }
    .toggle-wrap { display: flex; align-items: center; gap: 12px; }
    .toggle { width: 46px; height: 26px; border-radius: 100px; background: var(--g4); cursor: pointer; position: relative; transition: background 0.2s; flex-shrink: 0; }
    .toggle.on { background: var(--black); }
    .toggle-thumb { width: 20px; height: 20px; border-radius: 50%; background: #fff; position: absolute; top: 3px; left: 3px; transition: left 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.18); }
    .toggle.on .toggle-thumb { left: 23px; }
    .toggle-label { font-size: 13px; font-weight: 600; color: var(--g1); }
    .save-btn { width: 100%; padding: 14px; background: var(--black); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; min-height: 52px; }
    .daily-rec-card { background: var(--white); border-radius: var(--rs); padding: 14px 16px; margin-bottom: 8px; }
    .daily-rec-date { font-size: 11px; font-weight: 800; color: var(--g2); margin-bottom: 8px; }
    .daily-rec-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .daily-rec-chip { font-size: 11px; padding: 2px 8px; border-radius: 100px; font-weight: 700; }
    .daily-rec-row { font-size: 12px; color: var(--g1); margin-bottom: 3px; line-height: 1.4; }
    .daily-rec-row b { color: var(--g2); font-weight: 700; margin-right: 4px; }
    .daily-empty { background: var(--white); border-radius: var(--r); padding: 40px; text-align: center; font-size: 13px; color: var(--g2); }

    /* ── 컨디션 ── */
    .cond-card { background: var(--white); border-radius: var(--r); padding: 16px 18px; margin-bottom: 14px; }
    .cond-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .cond-title { font-size: 13px; font-weight: 800; }
    .cond-sel { display: flex; align-items: center; gap: 8px; flex: 1; }
    .cond-badge { padding: 5px 12px; border-radius: 100px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .cond-bar-wrap { flex: 1; height: 5px; background: var(--g4); border-radius: 100px; overflow: hidden; max-width: 100px; }
    .cond-bar-fill { height: 100%; border-radius: 100px; transition: width 0.4s; }
    .cond-change { font-size: 11px; color: var(--g3); cursor: pointer; text-decoration: underline; }
    .cond-strategy { font-size: 12px; color: var(--g2); line-height: 1.6; padding: 9px 12px; background: var(--g5); border-radius: 10px; margin-bottom: 12px; }
    .cond-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    @media (max-width: 400px) { .cond-grid { grid-template-columns: repeat(2, 1fr); } }
    .cond-btn { padding: 9px 4px; border-radius: 10px; border: 1.5px solid var(--g4); background: var(--white); font-size: 11px; cursor: pointer; color: var(--g1); text-align: center; font-family: inherit; transition: all 0.15s; min-height: 68px; }
    .cond-btn .ce { font-size: 18px; display: block; margin-bottom: 4px; }
    .cond-btn .cn { font-weight: 700; display: block; font-size: 11px; margin-bottom: 1px; }
    .cond-btn .ct { font-size: 10px; opacity: 0.7; display: block; }
    .cond-btn.active { border-color: transparent; color: #fff; }

    /* ── 시트 ── */
    .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .sheet-overlay.open { opacity: 1; pointer-events: all; }
    .sheet { background: var(--white); border-radius: 20px 20px 0 0; padding: 0 20px calc(20px + var(--safe)); width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32,0.72,0,1); }
    .sheet-overlay.open .sheet { transform: translateY(0); }
    .sheet-handle { width: 36px; height: 4px; background: var(--g4); border-radius: 100px; margin: 14px auto 20px; }
    .sheet-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
    .sheet-sub { font-size: 13px; color: var(--g2); margin-bottom: 20px; line-height: 1.5; }
    .sheet-input { width: 100%; border: 1.5px solid var(--g4); border-radius: var(--rs); padding: 14px 16px; font-size: 16px; font-weight: 600; font-family: inherit; outline: none; color: var(--black); background: var(--g5); margin-bottom: 14px; }
    .sheet-input:focus { border-color: var(--black); background: var(--white); }
    .preset-label { font-size: 11px; font-weight: 800; color: var(--g2); margin-bottom: 8px; }
    .preset-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px; }
    .preset-chip { padding: 7px 14px; border: 1.5px solid var(--g4); border-radius: 100px; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--g1); background: var(--white); font-family: inherit; min-height: 36px; }
    .preset-chip:hover { border-color: var(--black); color: var(--black); }
    .pump-q { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
    .pump-sub { font-size: 12px; color: var(--g2); margin-bottom: 14px; }
    .pump-examples { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px; }
    .pump-chip { padding: 8px 14px; border-radius: 100px; border: 1.5px solid var(--g4); background: var(--white); font-size: 12px; font-weight: 700; cursor: pointer; color: var(--g1); font-family: inherit; }
    .pump-chip:hover { border-color: var(--black); color: var(--black); }
    .btn-danger { padding: 14px 18px; background: var(--red-bg); color: var(--red); border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }

    /* 마무리 시트 */

  const t = trackName+goalName;
  for (const [k,v] of Object.entries(PUMP_EXAMPLES)) {

function makeTrack(name) { return {id:uid(),name,goals:[]}; }
function makeGoal(name) { return {id:uid(),name,pumpAction:'',lastDone:null}; }

// 시트 컨텍스트
let goalSheetId=null, addGoalTrackId=null;

function loadState() {
  try { const s=localStorage.getItem('trackOS_v8'); if(s) return JSON.parse(s); } catch(e){}
  return {
    tracks:[
      {id:uid(),name:'커리어',goals:[{id:uid(),name:'포트폴리오 완성',pumpAction:'',lastDone:null}]},

function save() { localStorage.setItem('trackOS_v8', JSON.stringify(state)); }

// ── 탭 ──
function switchTab(tab, btn) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
  btn.classList.add('active');
  if(tab==='today') renderToday();
  if(tab==='inbox') renderInbox();
  if(tab==='track') renderTrackTab();
  if(tab==='daily') renderDailyTab();
}

// ── API 설정 ──
function saveApiKey() {
  const url = document.getElementById('apiKeyInput').value.trim();
  if (url && !url.startsWith('https://')) {
    toast('https://로 시작하는 Worker URL을 입력해요');
    return;
  }
  state.proxyUrl = url;
  // 혹시 이전에 저장된 키가 있다면 제거
  delete state.apiKey;
  save();
  updateApiStatus();
  closeSheet('settingsSheet');
  toast(url ? 'Worker 연결됐어요 ✓' : '연결 해제됐어요');
}

function updateApiStatus() {
  const el = document.getElementById('apiStatus');
  if (!el) return;
  if (state.proxyUrl) {
    el.innerHTML = `<div style="display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--green-bg);border-radius:10px">
      <span style="font-size:16px">✓</span>
      <div>
        <div style="font-size:13px;font-weight:700;color:var(--green)">AI 분류 연결됨</div>
        <div style="font-size:11px;color:var(--green);opacity:0.8">${state.proxyUrl.replace('https://','').slice(0,30)}...</div>
      </div>
    </div>`;
    document.getElementById('apiKeyInput').value = state.proxyUrl;
  } else {
    el.innerHTML = `<div style="padding:10px 14px;background:var(--g5);border-radius:10px;font-size:12px;color:var(--g2)">
      미연결 — 기본 자동 분류만 사용돼요
    </div>`;
  }
  const btn = document.getElementById('settingsBtn');
  if (btn) btn.textContent = state.proxyUrl ? '🔑' : '⚙️';
}

function resetAll() {
  if (!confirm('모든 데이터를 초기화할까요? 복구할 수 없어요.')) return;
  localStorage.removeItem('trackOS_v8');
  location.reload();
}

// ── Claude API 분류 ──
const LOCAL_AGENT = 'http://localhost:3001';

async function callAgent(endpoint, body) {
  // 1순위: 로컬 에이전트, 2순위: Cloudflare 프록시
  const urls = [
    LOCAL_AGENT + endpoint,
    state.proxyUrl ? state.proxyUrl : null,
  ].filter(Boolean);

  for (const url of urls) {
    try {
      const isLocal = url.startsWith(LOCAL_AGENT);
      const fetchBody = isLocal ? body : {
        model: 'claude-haiku-4-5', max_tokens: 1024,
        messages: [{ role: 'user', content: JSON.stringify(body) }]
      };
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(fetchBody),
        signal: AbortSignal.timeout(15000),
      });
      if (!res.ok) continue;
      return { data: await res.json(), isLocal };
    } catch(e) {
      continue;
    }
  }
  return null;
}

async function classifyWithClaude(items) {
  const proxyUrl = state.proxyUrl;
  if (!proxyUrl && !(await isAgentRunning())) return null;

  const allGoals = state.tracks.flatMap(tr =>
    tr.goals.map(g => ({id:g.id, name:g.name, track:tr.name}))
  );

  const result = await callAgent('/classify', {
    tasks: items.map(i => i.text),
    goals: allGoals,
  });

  if (!result) return null;
  return result.data;
}

async function isAgentRunning() {
  try {
    const res = await fetch(LOCAL_AGENT + '/classify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tasks: ['test'], goals: [] }),
      signal: AbortSignal.timeout(1000),
    });
    return true;
  } catch(e) { return false; }
}

// ── 분류 로직 (스마트 자동분류) ──
function autoClassify(text) {
  const allGoals = state.tracks.flatMap(tr=>tr.goals.map(g=>({...g,trackName:tr.name,trackId:tr.id})));
  let bestGoal = null, bestScore = 0;

  for (const g of allGoals) {
    const combined = (g.name+' '+g.trackName).toLowerCase();
    const words = text.toLowerCase().split(/\s+/);
    let score = 0;
    for (const w of words) {
      if (w.length < 2) continue;
      if (combined.includes(w)) score += w.length;
    }
    if (score > bestScore) { bestScore=score; bestGoal=g; }
  }

  // 실행 계획 생성
  let suggestedAction = '';
  for (const [kw, action] of Object.entries(ACTION_TEMPLATES)) {
    if (text.includes(kw)) { suggestedAction=action; break; }
  }
  if (!suggestedAction && bestGoal) {
    suggestedAction = getPumpExamples(bestGoal.trackName, bestGoal.name)[0];
  }
  if (!suggestedAction) suggestedAction = '관련 탭 열기';

  return { goalId: bestScore>0?bestGoal?.id:null, action: suggestedAction };
}

// 아이템별 실행 단계 임시 저장
const reviewSteps = {}; // itemId → string[]

function renderReview(pending, container) {

    }

  const itemsHtml = pending.map((item) => {

    const finalGoalId = item._suggestedGoalId || ruleBased.goalId || '';

      ? `<div class="goal-connect-card selected" id="goal-card-${item.id}" onclick="toggleGoalSelect('${item.id}')">

          </div>

      : `<div class="goal-connect-card none-selected" id="goal-card-${item.id}" onclick="toggleGoalSelect('${item.id}')">

            <div class="goal-connect-track">목표 없음</div>

          </div>

        ${steps.length>1 ? `<button class="step-del-btn" onclick="removeStep('${item.id}',${i})">×</button>` : ''}
      </div>`).join('');

    return `<div class="classify-item" id="classify-${item.id}">

          <option value="later">⏳ 나중에 볼게요</option>
          <option value="out">🚫 scope 밖이에요</option>

function toggleGoalSelect(itemId) {
  const sel = document.getElementById(`sel-goal-${itemId}`);
  if (sel) sel.classList.toggle('show');
}

function onGoalChange(itemId, goalId) {
  const item = (state.inbox||[]).find(i=>i.id===itemId);
  if (item) item._suggestedGoalId = goalId;

  const nameInput = document.getElementById(`new-goal-name-${itemId}`);
  const trackSel = document.getElementById(`new-goal-track-sel-${itemId}`);

  // 새 목표 입력창 토글
  if (goalId === 'new') {
    if (nameInput) { nameInput.style.display = 'block'; nameInput.focus(); }
    if (trackSel) trackSel.style.display = 'block';
    updateGoalCard(itemId, null, null, 'new');
    return;
  } else {
    if (nameInput) nameInput.style.display = 'none';
    if (trackSel) trackSel.style.display = 'none';
  }

  const g = findGoalById(goalId);
  const tr = g ? state.tracks.find(t=>t.goals.some(gg=>gg.id===g.id)) : null;
  updateGoalCard(itemId, g, tr, goalId);
  document.getElementById(`sel-goal-${itemId}`)?.classList.remove('show');
}

function updateGoalCard(itemId, g, tr, goalId) {
  const card = document.getElementById(`goal-card-${itemId}`);
  if (!card) return;
  if (g && tr) {
    card.className = 'goal-connect-card selected';
    card.innerHTML = `<div class="goal-connect-icon">🎯</div>
      <div class="goal-connect-info">
        <div class="goal-connect-track">${tr.name}</div>
        <div class="goal-connect-name">${g.name}</div>
      </div>
      <div class="goal-connect-change">변경 ›</div>`;
  } else if (goalId === 'new') {
    card.className = 'goal-connect-card selected';
    card.innerHTML = `<div class="goal-connect-icon">✨</div>
      <div class="goal-connect-info">
        <div class="goal-connect-track">새 목표</div>
        <div class="goal-connect-name">아래에 이름 입력</div>
      </div>`;
  } else {
    const icons = {later:'⏳', out:'🚫', '':'❓'};
    const names = {later:'나중에 볼게요', out:'scope 밖이에요', '':'탭해서 연결하기'};
    card.className = 'goal-connect-card none-selected';
    card.innerHTML = `<div class="goal-connect-icon">${icons[goalId]||'❓'}</div>
      <div class="goal-connect-info">
        <div class="goal-connect-track">&nbsp;</div>
        <div class="goal-connect-name">${names[goalId]||'미연결'}</div>
      </div>`;
  }
  card.onclick = () => toggleGoalSelect(itemId);
}

function confirmNewGoalInline(itemId) {
  const nameInput = document.getElementById(`new-goal-name-${itemId}`);
  const trackSel = document.getElementById(`new-goal-track-${itemId}`);
  const name = nameInput?.value.trim();
  const trackId = trackSel?.value;
  if (!name) { nameInput?.focus(); toast('목표 이름을 입력해요'); return; }

  const tr = state.tracks.find(t=>t.id===trackId) || state.tracks[0];
  if (!tr) { toast('트랙을 먼저 만들어요'); return; }

  const newGoal = makeGoal(name);
  tr.goals.push(newGoal);
  save();

  // 선택 반영
  const sel = document.getElementById(`sel-goal-${itemId}`);
  const opt = document.createElement('option');
  opt.value = newGoal.id; opt.textContent = `${tr.name} › ${name}`;
  sel?.insertBefore(opt, sel.querySelector('option[value="new"]'));
  if (sel) sel.value = newGoal.id;

  const item = (state.inbox||[]).find(i=>i.id===itemId);
  if (item) item._suggestedGoalId = newGoal.id;

  if (nameInput) nameInput.style.display = 'none';
  const trackSelDiv = document.getElementById(`new-goal-track-sel-${itemId}`);
  if (trackSelDiv) trackSelDiv.style.display = 'none';

  updateGoalCard(itemId, newGoal, tr, newGoal.id);
  toast(`"${name}" 목표가 추가됐어요 ✓`);
}

function updateStep(itemId, idx, val) {
  if (!reviewSteps[itemId]) reviewSteps[itemId] = [];
  reviewSteps[itemId][idx] = val;
}

function addStep(itemId) {
  if (!reviewSteps[itemId]) reviewSteps[itemId] = [];
  reviewSteps[itemId].push('');
  reRenderSteps(itemId);
}

function removeStep(itemId, idx) {
  if (!reviewSteps[itemId]) return;
  reviewSteps[itemId].splice(idx, 1);
  reRenderSteps(itemId);
}

function reRenderSteps(itemId) {
  const steps = reviewSteps[itemId] || [];
  const container = document.getElementById(`steps-list-${itemId}`);
  if (!container) return;
  container.innerHTML = steps.map((s, i) => `
    <div class="step-edit-row" id="step-row-${itemId}-${i}">
      <span class="step-edit-num">${i+1}</span>
      <input class="step-edit-input" id="step-${itemId}-${i}" type="text"
        value="${s}" placeholder="실행 단계 ${i+1}"
        onchange="updateStep('${itemId}',${i},this.value)"
        onblur="updateStep('${itemId}',${i},this.value)" />
      ${steps.length>1 ? `<button class="step-del-btn" onclick="removeStep('${itemId}',${i})">×</button>` : ''}
    </div>`).join('');
  // 마지막 입력창에 포커스
  const last = document.getElementById(`step-${itemId}-${steps.length-1}`);
  if (last) last.focus();
}

async function startClassify() {
  const area = document.getElementById('captureArea');
  const text = area?.value.trim();
  if (!text) { toast('할 일을 먼저 입력해요'); return; }
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  if (!lines.length) { toast('할 일을 한 줄씩 입력해요'); return; }

  if (!state.inbox) state.inbox=[];

  // 이미 같은 텍스트로 pending인 항목 중복 방지
  const existingTexts = new Set(
    (state.inbox||[]).filter(i=>i.status==='pending'&&i.isToday).map(i=>i.text)
  );
  const deduped = lines.filter(l=>!existingTexts.has(l));
  if (!deduped.length) { toast('이미 분류 대기 중인 항목이에요'); return; }

  const newItems = deduped.map(l=>({
    id:uid(), text:l, createdAt:new Date().toISOString(),
    status:'pending', goalId:null, action:'', isToday:true,
    doneAt:null, failedAt:null,
  }));
  state.inbox = [...newItems, ...state.inbox];
  state.inboxStep = 'review';

  // textarea 초기화 (중복 제출 방지)
  if (area) area.value = '';
  save();

  // AI 분류 시도
  if (state.proxyUrl) {
    const btn = document.querySelector('[onclick="startClassify()"]');
    if (btn) { btn.textContent = '✦ AI 분류 중...'; btn.disabled = true; }
    try {
      const results = await classifyWithClaude(newItems);
      if (results) {
        results.forEach(r => {
          const item = newItems[r.index - 1];
          if (item) {
            if (r.goalId) item._suggestedGoalId = r.goalId;
            if (r.action) item._suggestedAction = r.action;
          }
        });
        save();
        toast('✦ AI 분류 완료');
      }
    } catch(e) {
      console.error(e);
      toast(`AI 오류: ${e.message} — 기본 분류로 진행해요`);
    } finally {
      if (btn) { btn.textContent = '자동 분류하기'; btn.disabled = false; }
    }
  }

  renderInbox();
}

function cancelReview() {
  // 방금 추가한 pending 아이템 제거
  state.inbox = (state.inbox||[]).filter(i=>i.status!=='pending'||!i.isToday);
  state.inboxStep = 'input';
  save(); renderInbox();
}

function confirmReview() {
  const pending = (state.inbox||[]).filter(i=>i.status==='pending'&&i.isToday);
  pending.forEach(item => {
    const goalSel = document.getElementById(`sel-goal-${item.id}`)?.value
                  || item._suggestedGoalId || '';
    const steps = (reviewSteps[item.id] || []).map(s=>s.trim()).filter(Boolean);
    const action = steps[0] || item.text;

    if (goalSel==='later') {
      item.status='later'; item.isToday=false;
    } else if (goalSel==='out') {
      item.status='out'; item.isToday=false;
    } else if (goalSel==='new') {
      if (state.tracks.length>0) {
        const g = makeGoal(item.text.slice(0,40));
        state.tracks[0].goals.push(g);
        item.goalId=g.id; item.action=action; item.steps=steps; item.status='classified';
      }
    } else if (goalSel) {
      item.goalId=goalSel; item.action=action; item.steps=steps; item.status='classified';
    } else {
      // 목표 미선택 → 보류
      item.status='later'; item.isToday=false;
    }
    delete reviewSteps[item.id];
  });
  state.inboxStep='input';
  save(); renderInbox(); renderToday();
  const done = pending.filter(i=>i.status==='classified').length;
  toast(`${done}개 오늘 목록에 추가됐어요 ✓`);
}

// ── Claude Code 연동 ──
function openClaudeExport() {
  const pending = (state.inbox||[]).filter(i=>i.status==='pending'&&i.isToday);
  if (!pending.length) { toast('분류할 항목이 없어요'); return; }

  const allGoals = state.tracks.flatMap(tr=>
    tr.goals.map(g=>({goalId:g.id, name:g.name, track:tr.name}))
  );

  const goalsJson = JSON.stringify(allGoals, null, 2);
  const tasksList = pending.map((t,i)=>`${i+1}. ${t.text}`).join('\n');

  const exportText = `=== 내 목표 ===
${goalsJson}

=== 오늘 할 일 ===
${tasksList}`;

  document.getElementById('claudeExportText').value = exportText;
  document.getElementById('claudeImportText').value = '';
  openSheet('claudeExportSheet');
}

function copyExport() {
  const text = document.getElementById('claudeExportText').value;
  navigator.clipboard.writeText(text).then(()=>toast('복사됐어요 ✓'));
}

function importClaudeResult() {
  const raw = document.getElementById('claudeImportText').value.trim();
  if (!raw) { toast('결과를 붙여넣어 주세요'); return; }

  let results;
  try {
    const match = raw.match(/\[[\s\S]*\]/);
    results = JSON.parse(match ? match[0] : raw);
  } catch(e) {
    toast('JSON 형식이 올바르지 않아요'); return;
  }

  const pending = (state.inbox||[]).filter(i=>i.status==='pending'&&i.isToday);

  results.forEach(r => {
    const item = pending[r.index - 1];
    if (!item) return;
    if (r.scope === 'out') { item.status='out'; item.isToday=false; }
    else if (r.scope === 'later') { item.status='later'; item.isToday=false; }
    else {
      item.goalId = r.goalId || null;
      item.action = r.action || item.text;
      item.status = 'classified';
    }
  });

  state.inboxStep = 'input';
  save(); closeSheet('claudeExportSheet'); renderInbox(); renderToday();
  const done = results.filter(r=>r.scope==='in'||!r.scope).length;
  toast(`${done}개 분류 완료 ✓`);
}

async function reSuggest(itemId) {
  const item = (state.inbox||[]).find(i=>i.id===itemId);
  if (!item) return;

  const goalSel = document.getElementById(`sel-goal-${itemId}`);
  const goalId = goalSel?.value;
  const g = findGoalById(goalId);
  const tr = g ? state.tracks.find(t=>t.goals.some(gg=>gg.id===g.id)) : null;
  // actionEl 제거 — steps 방식으로 변경됨
  const badge = document.querySelector(`#classify-${itemId} .ai-badge`);

  // 에이전트 호출 시도
  if (badge) { badge.textContent = '✦ 생각 중...'; badge.disabled = true; }

  try {
    const result = await callAgent('/suggest', {
      task: item.text,
      goalName: g?.name || '',
      trackName: tr?.name || '',
    });

    if (result?.data && Array.isArray(result.data) && result.data.length > 0) {
      reviewSteps[itemId] = result.data;
      reRenderSteps(itemId);
      if (badge) { badge.textContent = '✦ AI 제안 — 다시 받기'; badge.disabled = false; }
      toast('✦ AI가 실행 계획을 제안했어요');
      return;
    }
  } catch(e) {}

  // 폴백: 룰 기반 (3개 제안)
  let suggestions = [];
  for (const [kw, action] of Object.entries(ACTION_TEMPLATES)) {
    if (item.text.includes(kw)) suggestions.push(action);
  }
  if (tr||g) suggestions.push(...getPumpExamples(tr?.name||'', g?.name||''));
  suggestions.push(...PUMP_EXAMPLES['default']);
  suggestions = [...new Set(suggestions)].slice(0, 3);

  reviewSteps[itemId] = suggestions;
  reRenderSteps(itemId);
  if (badge) { badge.textContent = '✦ 자동 제안 — 다시 받기'; badge.disabled = false; }
}

function updateBadge() {
  const n = (state.inbox||[]).filter(i=>i.status==='classified'&&i.isToday&&!i.doneAt&&!i.failedAt).length;
  const badge = document.getElementById('inboxBadge');
  if (n>0) { badge.textContent=n; badge.classList.add('show'); }
  else badge.classList.remove('show');
}

// ── 오늘 대시보드 ──
function isToday(iso) { return iso&&iso.slice(0,10)===new Date().toISOString().slice(0,10); }

function renderToday() {
  const container = document.getElementById('todayDash');
  const todayTasks = (state.inbox||[]).filter(i=>i.status==='classified'&&i.isToday);
  const done = todayTasks.filter(i=>i.doneAt&&isToday(i.doneAt));
  const failed = todayTasks.filter(i=>i.failedAt&&isToday(i.failedAt));
  const todo = todayTasks.filter(i=>!i.doneAt&&!i.failedAt);
  const total = todayTasks.length;
  const doneCount = done.length;
  const pct = total ? Math.round(doneCount/total*100) : 0;

  const cond = state.condition ? CMAP[state.condition] : null;
  const dateStr = new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});

  let msg = '';
  if (total===0) msg = '';
  else if (doneCount===total) msg = '오늘 다 완료했어요! 🎉';
  else if (doneCount===0) msg = '아직 시작 전이에요';
  else msg = `${todo.length}개 남았어요`;

  // 컨디션 카드
  let condHtml = `<div class="cond-card">
    <div class="cond-row">
      <span class="cond-title">오늘 컨디션</span>
      <div class="cond-sel" id="condSel" style="display:${cond?'flex':'none'}">
        <span class="cond-badge" id="condBadge" style="${cond?`background:${cond.bg};color:${cond.c}`:''}">
          ${cond?`${cond.e} ${cond.n}`:''}
        </span>
        <div class="cond-bar-wrap"><div class="cond-bar-fill" id="condFill" style="${cond?`width:${cond.v}%;background:${cond.c}`:''}"></div></div>
        <span class="cond-change" onclick="clearCond()">변경</span>
      </div>
    </div>
    ${cond?`<div class="cond-strategy">${cond.s}</div>`:''}
    <div class="cond-grid" id="condGrid" style="display:${cond?'none':'grid'}">
      ${CONDITIONS.map(c=>`<button class="cond-btn ${state.condition===c.id?'active':''}" style="${state.condition===c.id?`background:${c.c};`:''}" onclick="setCond('${c.id}')">
        <span class="ce">${c.e}</span><span class="cn">${c.n}</span><span class="ct">${c.t}</span>
      </button>`).join('')}
    </div>
  </div>`;

  if (total===0) {
    container.innerHTML = condHtml + `
      <div class="today-empty">
        <div class="today-empty-icon">📥</div>
        <div class="today-empty-text">오늘 할 일이 없어요</div>
        <div class="today-empty-sub">준비 탭에서 오늘 할 일을 입력하고<br/>분류하면 여기에 나타나요</div>
        <button class="go-inbox-btn" onclick="document.querySelector('.tab-btn:nth-child(2)').click()">오늘 준비하러 가기 →</button>
      </div>`;
    return;
  }

  // 대시보드 요약
  let dashHtml = `
    <div class="dash-summary">
      <div class="dash-date">${dateStr}</div>
      <div class="dash-numbers">
        <span class="dash-done">${doneCount}</span>
        <span class="dash-sep">/</span>
        <span class="dash-total">${total}</span>
        <span class="dash-label">${msg}</span>
      </div>
      <div class="dash-bar-bg"><div class="dash-bar-fill" style="width:${pct}%"></div></div>
      <div class="dash-stats">
        <div class="dash-stat"><div class="dash-stat-dot" style="background:#fff"></div> 완료 ${doneCount}</div>
        <div class="dash-stat"><div class="dash-stat-dot" style="background:rgba(255,255,255,0.4)"></div> 못함 ${failed.length}</div>
        <div class="dash-stat"><div class="dash-stat-dot" style="background:rgba(255,255,255,0.2)"></div> 남음 ${todo.length}</div>
      </div>
    </div>`;

  // 실행 리스트
  const execItems = [...todo, ...done, ...failed].map(item=>{
    const g = findGoalById(item.goalId);
    const tr = g ? state.tracks.find(t=>t.goals.some(gg=>gg.id===g.id)) : null;
    const isDone = !!item.doneAt;
    const isFailed = !!item.failedAt;
    const doneTime = item.doneAt ? new Date(item.doneAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}) : '';
    return `<div class="exec-item ${isDone?'done':''} ${isFailed?'failed':''}">
      <div class="exec-meta">
        ${tr?`<div class="exec-track">${tr.name}${g?' › '+g.name:''}</div>`:''}
        <div class="exec-action ${isDone?'done':''} ${isFailed?'failed':''}">${item.action}</div>
        <div class="exec-original">${item.text}${isDone?' · '+doneTime:''}</div>
      </div>
      <div class="exec-btns">
        <button class="exec-btn exec-btn-done ${isDone?'active':''}" onclick="markExecDone('${item.id}')" title="완료">✓</button>
        <button class="exec-btn exec-btn-fail ${isFailed?'active':''}" onclick="markExecFail('${item.id}')" title="못함">✗</button>
        <button class="exec-btn" onclick="deleteExecItem('${item.id}')" title="삭제" style="background:var(--g5);color:var(--g3);font-size:14px">🗑</button>
      </div>
    </div>`;
  }).join('');

  const unfinished = todayTasks.filter(i=>!i.doneAt&&!i.failedAt);
  const finishBtnHtml = unfinished.length>0
    ? `<button class="finish-btn" onclick="openFinish()">🌙 하루 마무리하기</button>`
    : doneCount>0 ? `<div class="today-msg">오늘 수고했어요 ✨ 데일리 체크도 해보세요</div>` : '';

  container.innerHTML = condHtml + dashHtml + `
    <div class="exec-card">${execItems}</div>
    ${finishBtnHtml}`;
}

function setCond(id) { state.condition=id; state.conditionDate=new Date().toISOString().slice(0,10); save(); renderToday(); }
function clearCond() { state.condition=null; save(); renderToday(); }

function markExecDone(itemId) {
  const item = (state.inbox||[]).find(i=>i.id===itemId);
  if (!item) return;
  if (item.doneAt) { item.doneAt=null; }
  else { item.doneAt=new Date().toISOString(); item.failedAt=null; logActivity(item); }
  save(); renderToday(); updateBadge();
}

function deleteExecItem(itemId) {
  state.inbox = (state.inbox||[]).filter(i=>i.id!==itemId);
  save(); renderToday(); updateBadge();
}

function markExecFail(itemId) {
  const item = (state.inbox||[]).find(i=>i.id===itemId);
  if (!item) return;
  if (item.failedAt) { item.failedAt=null; }
  else { item.failedAt=new Date().toISOString(); item.doneAt=null; }
  save(); renderToday(); updateBadge();
}

function logActivity(item) {
  const g = findGoalById(item.goalId);
  const tr = g ? state.tracks.find(t=>t.goals.some(gg=>gg.id===g.id)) : null;
  const c = state.condition ? CMAP[state.condition] : null;
  if (!state.activityLog) state.activityLog=[];
  state.activityLog.unshift({
    id:uid(), timestamp:new Date().toISOString(),
    trackName:tr?.name||'', goalName:g?.name||'', action:item.action,
    conditionEmoji:c?.e||'—', conditionName:c?.n||'—',
    conditionColor:c?.c||'#888', conditionBg:c?.bg||'#f5f5f5',
  });
  if (state.activityLog.length>300) state.activityLog=state.activityLog.slice(0,300);
}

// ── 마무리 ──
function openFinish() {
  const unfinished = (state.inbox||[]).filter(i=>i.status==='classified'&&i.isToday&&!i.doneAt&&!i.failedAt);
  if (!unfinished.length) { toast('미완료 항목이 없어요'); return; }
  const g_map = {};
  document.getElementById('finishList').innerHTML = unfinished.map(item=>{
    const g = findGoalById(item.goalId);
    const tr = g ? state.tracks.find(t=>t.goals.some(gg=>gg.id===g.id)) : null;
    return `<div class="finish-item">
      <div class="finish-item-info">
        ${tr||g?`<div class="finish-item-goal">${tr?.name||''}${g?' › '+g.name:''}</div>`:''}
        <div class="finish-item-action">${item.action}</div>
      </div>
      <div class="finish-item-btns">
        <button class="finish-chk finish-chk-done" id="fc-done-${item.id}" onclick="setFinish('${item.id}','done')">완료</button>
        <button class="finish-chk finish-chk-fail" id="fc-fail-${item.id}" onclick="setFinish('${item.id}','fail')">못함</button>
      </div>
    </div>`;
  }).join('');
  openSheet('finishSheet');
}

function setFinish(itemId, result) {
  document.getElementById(`fc-done-${itemId}`)?.classList.toggle('sel', result==='done');
  document.getElementById(`fc-fail-${itemId}`)?.classList.toggle('sel', result==='fail');
  document.getElementById(`fc-done-${itemId}`)?.classList.toggle('sel', result==='done');
  document.getElementById(`fc-fail-${itemId}`)?.classList.toggle('sel', result!=='done');
}

function confirmFinish() {
  const unfinished = (state.inbox||[]).filter(i=>i.status==='classified'&&i.isToday&&!i.doneAt&&!i.failedAt);
  unfinished.forEach(item=>{
    const doneBtn = document.getElementById(`fc-done-${item.id}`);
    const failBtn = document.getElementById(`fc-fail-${item.id}`);
    if (doneBtn?.classList.contains('sel')) { item.doneAt=new Date().toISOString(); logActivity(item); }
    else if (failBtn?.classList.contains('sel')) { item.failedAt=new Date().toISOString(); }
    else { item.failedAt=new Date().toISOString(); } // 선택 안 하면 못함으로
  });
  save(); closeSheet('finishSheet'); renderToday(); updateBadge();
  toast('마무리 완료 🌙 데일리 체크도 해보세요');
}

// ── 트랙 탭 ──
function renderTrackTab() {
  const container = document.getElementById('trackList');
  container.innerHTML = state.tracks.map(tr=>`
    <div class="track-section">
      <div class="track-head">
        <span class="track-head-name">${tr.name}</span>
        <button class="track-icon-btn" onclick="renameTrack('${tr.id}')">✏️</button>
        <button class="track-icon-btn" onclick="deleteTrack('${tr.id}')">🗑</button>
      </div>
      ${tr.goals.map(g=>{
        const d = g.lastDone ? Math.floor((Date.now()-new Date(g.lastDone))/86400000) : null;
        const badge = d===null?'badge-red':d===0?'badge-green':d<=3?'badge-green':d<=7?'badge-yellow':'badge-red';
        const label = d===null?'시작 안 함':d===0?'오늘 건드림':`${d}일 전`;
        return `<div class="goal-row" onclick="openGoalSheet('${g.id}')">
          <div class="goal-row-info">
            <div class="goal-row-name">${g.name}</div>
            <div class="goal-row-pump">${g.pumpAction||'마중물 없음'}</div>
          </div>
          <span class="goal-badge ${badge}">${label}</span>
          <button class="goal-del-btn" onclick="event.stopPropagation();deleteGoalDirect('${g.id}')">×</button>
        </div>`;
      }).join('')}
      <button class="add-goal-btn" onclick="openAddGoal('${tr.id}')">+ 목표 추가</button>
    </div>`).join('');
}

function openAddGoal(trackId) {
  addGoalTrackId=trackId;
  const tr=state.tracks.find(t=>t.id===trackId);
  document.getElementById('addGoalSub').textContent=`트랙: ${tr.name}`;
  document.getElementById('newGoalName').value='';
  openSheet('addGoalSheet');
  setTimeout(()=>document.getElementById('newGoalName').focus(),300);
}

function confirmAddGoal() {
  const n=document.getElementById('newGoalName').value.trim(); if(!n) return;
  const tr=state.tracks.find(t=>t.id===addGoalTrackId); if(!tr) return;
  tr.goals.push(makeGoal(n)); save(); closeSheet('addGoalSheet'); renderTrackTab();
  toast(`목표 추가됨`);
}

function confirmAddTrack() {
  const n=document.getElementById('newTrackName').value.trim(); if(!n) return;
  state.tracks.push(makeTrack(n)); save(); closeSheet('addTrackSheet'); renderTrackTab();
  toast(`"${n}" 트랙 추가됨`);
}

function renameTrack(id) {
  const tr=state.tracks.find(t=>t.id===id);
  const n=prompt('트랙 이름:',tr.name);
  if(n&&n.trim()){tr.name=n.trim();save();renderTrackTab();}
}

function deleteTrack(id) {
  const tr=state.tracks.find(t=>t.id===id);
  if(!confirm(`"${tr.name}" 트랙을 삭제할까요?`)) return;
  state.tracks=state.tracks.filter(t=>t.id!==id);
  save();renderTrackTab();renderToday();
}

// ── 목표 시트 ──
function findGoalById(goalId) {
  if(!goalId) return null;
  for(const tr of state.tracks){const g=tr.goals.find(g=>g.id===goalId);if(g) return g;}
  return null;
}

function openGoalSheet(goalId) {
  goalSheetId=goalId;
  const g=findGoalById(goalId); if(!g) return;
  const tr=state.tracks.find(t=>t.goals.some(gg=>gg.id===goalId));
  document.getElementById('goalSheetTrack').textContent=tr?.name||'';
  document.getElementById('goalSheetName').textContent=g.name;
  document.getElementById('pumpQ').textContent=`지금 "${g.name}"에서 뭘 할 수 있어?`;
  document.getElementById('pumpInput').value=g.pumpAction||'';
  document.getElementById('pumpExamples').innerHTML=getPumpExamples(tr?.name||'',g.name).map(ex=>`<button class="pump-chip" onclick="document.getElementById('pumpInput').value='${ex}'">${ex}</button>`).join('');
  openSheet('goalSheet');
  setTimeout(()=>document.getElementById('pumpInput').focus(),300);
}

function savePump() {
  const g=findGoalById(goalSheetId); if(!g) return;
  g.pumpAction=document.getElementById('pumpInput').value.trim();
  save(); closeSheet('goalSheet'); renderTrackTab(); renderToday();
  toast('저장됐어요 💧');
}

function renameGoal() {
  const g=findGoalById(goalSheetId); if(!g) return;
  const n=prompt('목표 이름 수정:', g.name);
  if(!n||!n.trim()) return;
  g.name=n.trim(); save(); renderTrackTab();
  document.getElementById('goalSheetName').textContent=g.name;
  document.getElementById('pumpQ').textContent=`지금 "${g.name}"에서 뭘 할 수 있어?`;
  toast('이름이 수정됐어요');
}

function deleteGoalDirect(goalId) {
  const g=findGoalById(goalId); if(!g) return;
  if(!confirm(`"${g.name}" 목표를 삭제할까요?`)) return;
  for(const tr of state.tracks){tr.goals=tr.goals.filter(gg=>gg.id!==goalId);}
  save(); renderTrackTab(); renderToday();
  toast('삭제됐어요');
}

function deleteGoalConfirm() {
  const g=findGoalById(goalSheetId); if(!g) return;
  if(!confirm(`"${g.name}" 목표를 삭제할까요?`)) return;
  for(const tr of state.tracks){tr.goals=tr.goals.filter(gg=>gg.id!==goalSheetId);}
  save(); closeSheet('goalSheet'); renderTrackTab(); renderToday();
  toast('삭제됐어요');
}

// ── 활동 로그 ──
function renderLogSheet() {
  const log=state.activityLog||[];
  const el=document.getElementById('logList');
  if(!log.length){el.innerHTML='<div style="font-size:13px;color:var(--g2);padding:20px 0;text-align:center">아직 기록이 없어요.</div>';return;}
  el.innerHTML=log.slice(0,60).map(e=>{
    const time=new Date(e.timestamp).toLocaleDateString('ko-KR',{month:'long',day:'numeric'})+' '+new Date(e.timestamp).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
    return `<div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--g5)">
      <div style="width:32px;height:32px;border-radius:50%;background:${e.conditionBg||'#f5f5f5'};display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0">${e.conditionEmoji||'—'}</div>
      <div style="flex:1">
        <div style="font-size:10px;font-weight:800;color:var(--g2)">${e.trackName}${e.goalName?' › '+e.goalName:''}</div>
        <div style="font-size:13px;font-weight:700;color:var(--black)">${e.action}</div>
      </div>
      <div style="font-size:11px;color:var(--g3);flex-shrink:0">${time}</div>
    </div>`;
  }).join('');
}

// ── 데일리 ──
function renderDailyTab() {
  document.getElementById('dailyDate').textContent=new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
  const tk=new Date().toISOString().slice(0,10);
  const ex=(state.dailyLog||[]).find(e=>e.date===tk);
  if(ex){dStates=new Set(ex.states||[]);dDuties=new Set(ex.duties||[]);dGreyday=ex.greyday||false;document.getElementById('dailyEating').value=ex.eating||'';document.getElementById('dailyNotes').value=ex.notes||'';document.getElementById('dailyEmotion').value=ex.emotion||'';}
  else{dStates=new Set();dDuties=new Set();dGreyday=false;['dailyEating','dailyNotes','dailyEmotion'].forEach(id=>document.getElementById(id).value='');}
  renderDSChips();renderDDChips();renderGT();renderDailyLog();
}

function renderDSChips(){document.getElementById('dailyStateChips').innerHTML=DAILY_STATES.map(s=>`<button class="chip ${dStates.has(s.id)?'on':''}" style="${dStates.has(s.id)?`background:${s.c};border-color:${s.c};color:#fff`:''}" onclick="toggleDS('${s.id}')">${s.label}</button>`).join('');}
function toggleDS(id){dStates.has(id)?dStates.delete(id):dStates.add(id);renderDSChips();}
function renderDDChips(){document.getElementById('dailyDutyChips').innerHTML=(state.duties||[]).map(d=>`<div class="chip ${dDuties.has(d)?'on':''}" onclick="toggleDD('${d}')" style="${dDuties.has(d)?'background:var(--black);border-color:var(--black);color:#fff':''}">${dDuties.has(d)?'✓ ':''} ${d}</div>`).join('')+`<button class="chip-add" onclick="addDuty()">+ 추가</button>`;}
function toggleDD(d){dDuties.has(d)?dDuties.delete(d):dDuties.add(d);renderDDChips();}
function addDuty(){const n=prompt('의무 항목:');if(n&&n.trim()&&!state.duties.includes(n.trim())){state.duties.push(n.trim());save();}renderDDChips();}
function toggleGreyday(){dGreyday=!dGreyday;renderGT();}
function renderGT(){document.getElementById('greydayToggle').classList.toggle('on',dGreyday);document.getElementById('greydayLabel').textContent=dGreyday?'Grey Day':'아님';}

function saveDailyCheck(){
  if(!state.dailyLog)state.dailyLog=[];
  const tk=new Date().toISOString().slice(0,10);
  const entry={date:tk,states:[...dStates],eating:document.getElementById('dailyEating').value.trim(),duties:[...dDuties],greyday:dGreyday,notes:document.getElementById('dailyNotes').value.trim(),emotion:document.getElementById('dailyEmotion').value.trim()};
  const i=state.dailyLog.findIndex(e=>e.date===tk);
  if(i>=0)state.dailyLog[i]=entry;else state.dailyLog.unshift(entry);
  state.dailyLog.sort((a,b)=>b.date.localeCompare(a.date));
  save();renderDailyLog();toast('저장됐어요 ✓');
}

function clearDailyLog(){if(!confirm('데일리 로그를 삭제할까요?'))return;state.dailyLog=[];save();renderDailyLog();}

function renderDailyLog(){
  const log=state.dailyLog||[];
  const el=document.getElementById('dailyLogList');
  if(!log.length){el.innerHTML='<div class="daily-empty">아직 기록이 없어요.</div>';return;}
  const td=new Date().toISOString().slice(0,10);
  const yd=new Date(Date.now()-86400000).toISOString().slice(0,10);
  const lbl=d=>d===td?'오늘':d===yd?'어제':new Date(d+'T00:00:00').toLocaleDateString('ko-KR',{month:'long',day:'numeric'});
  el.innerHTML=log.map(e=>{
    const chips=(e.states||[]).map(sid=>{const s=DSMAP[sid];return s?`<span class="daily-rec-chip" style="background:${s.bg};color:${s.c}">${s.label}</span>`:''}).join('');
    return `<div class="daily-rec-card">
      <div class="daily-rec-date">${lbl(e.date)}</div>
      ${chips?`<div class="daily-rec-chips">${chips}</div>`:''}
      ${e.eating?`<div class="daily-rec-row"><b>식습관</b>${e.eating}</div>`:''}
      ${(e.duties||[]).length?`<div class="daily-rec-row"><b>의무</b>${e.duties.join(', ')}</div>`:''}
      ${e.notes?`<div class="daily-rec-row"><b>비고</b>${e.notes}</div>`:''}
      ${e.emotion?`<div class="daily-rec-row"><b>감정</b>${e.emotion}</div>`:''}
      ${e.greyday?`<div class="daily-rec-row" style="color:var(--g1)">Grey Day</div>`:''}
    </div>`;
  }).join('');
}

// ── 시트 ──
function openSheet(id){document.getElementById(id).classList.add('open');if(id==='logSheet')renderLogSheet();if(id==='settingsSheet')updateApiStatus();}
function closeSheet(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.sheet-overlay').forEach(el=>{el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('open');});});

// ── 유틸 ──
function setInput(id,val){document.getElementById(id).value=val;document.getElementById(id).focus();}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500);}

// ── 초기화 ──
const todayKey=new Date().toISOString().slice(0,10);
if(state.conditionDate!==todayKey){
  state.condition=null;state.conditionDate=todayKey;
  // 어제 날짜 아이템은 isToday 해제
  (state.inbox||[]).forEach(i=>{if(i.isToday&&i.createdAt&&i.createdAt.slice(0,10)!==todayKey)i.isToday=false;});
  save();
}

renderToday();
updateBadge();
updateApiStatus();
</script>
